<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartMeet Meeting</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .meeting-container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .meeting-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .meeting-info {
            margin: 10px 0;
        }

        .video-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        video {
            width: 100%;
            background: #111;
            border-radius: 10px;
            min-height: 250px;
            object-fit: cover;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .controls button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .meeting-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-top: 20px;
        }

        .side-panel {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
        }

        #messages {
            height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
        }

        #chatBox {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
        }

        #sendBtn {
            margin-top: 10px;
            padding: 10px 15px;
        }

        .leave-btn {
            background: #d32f2f;
            color: white;
        }

        @media (max-width: 700px) {

            .video-area {
                grid-template-columns: 1fr;
            }

            .meeting-content {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="meeting-container">


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <div class="meeting-header">

        <div>

            <h1 id="meetingTitle">
                SmartMeet Meeting
            </h1>

            <div class="meeting-info">

                <strong>
                    Meeting ID:
                </strong>

                <span id="meetingId">
                    -
                </span>

                <button id="copyBtn">
                    Copy ID
                </button>

            </div>

        </div>


        <div>

            <strong>
                Time:
            </strong>

            <span id="timer">
                00:00:00
            </span>

        </div>

    </div>


    <!-- ================================= -->
    <!-- VIDEO -->
    <!-- ================================= -->

    <div class="video-area">

        <div>

            <h3>
                You
            </h3>

            <video
                id="localVideo"
                autoplay
                muted
                playsinline
            ></video>

        </div>


        <div>

            <h3>
                Remote Participant
            </h3>

            <video
                id="remoteVideo"
                autoplay
                playsinline
            ></video>

        </div>

    </div>


    <!-- ================================= -->
    <!-- MULTIPLE USERS -->
    <!-- ================================= -->

    <div
        id="userVideoContainer"
        style="
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:15px;
        "
    >
    </div>


    <!-- ================================= -->
    <!-- CONTROLS -->
    <!-- ================================= -->

    <div class="controls">

        <button id="cameraBtn">
            📷 Camera ON
        </button>

        <button id="micBtn">
            🎤 Mic ON
        </button>

        <button id="screenBtn">
            🖥 Screen Share
        </button>

        <button
            id="leaveBtn"
            class="leave-btn"
        >
            🚪 Leave Meeting
        </button>

    </div>


    <!-- ================================= -->
    <!-- CONTENT -->
    <!-- ================================= -->

    <div class="meeting-content">


        <!-- ================================= -->
        <!-- CHAT -->
        <!-- ================================= -->

        <div class="side-panel">

            <h2>
                💬 Chat
            </h2>

            <div id="messages">
            </div>

            <input
                type="text"
                id="chatBox"
                placeholder="Type message..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>


        <!-- ================================= -->
        <!-- PARTICIPANTS -->
        <!-- ================================= -->

        <div class="side-panel">

            <h2>
                👥 Participants
            </h2>

            <div id="participants">
                <p>
                    No participants
                </p>
            </div>

        </div>


    </div>


</div>


<!-- ========================================= -->
<!-- SOCKET.IO CLIENT - MUST COME FIRST -->
<!-- ========================================= -->

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


<!-- ========================================= -->
<!-- MEETING JAVASCRIPT -->
<!-- ========================================= -->

<script src="js/meeting.js"></script>


</body>

</html>
