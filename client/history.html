<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartMeet - Meeting History</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="history-container">

    <h1>Meeting History</h1>

    <div id="historyList"></div>

    <button
        type="button"
        class="history-back-btn"
        onclick="window.location.href='dashboard.html'">
        Back to Dashboard
    </button>

</div>


<script>

async function loadHistory() {

    const historyList =
        document.getElementById("historyList");

    historyList.innerHTML =
        "<p class='loading-text'>Loading meeting history...</p>";


    try {

       const response =
    await fetch(
        "https://smartmeet-production.up.railway.app/api/meetings/history"
    );


        const data =
            await response.json();


        if (
            !data.success ||
            !Array.isArray(data.meetings)
        ) {

            historyList.innerHTML =
                "<p class='empty-history'>No meeting history found.</p>";

            return;

        }


        if (data.meetings.length === 0) {

            historyList.innerHTML =
                "<p class='empty-history'>No meeting history found.</p>";

            return;

        }


        historyList.innerHTML = "";


        data.meetings.forEach(
            function (meeting) {

                const card =
                    document.createElement("div");

                card.className =
                    "history-card";


                // ==========================
                // MEETING NAME
                // ==========================

                const title =
                    document.createElement("h3");

                title.innerText =
                    meeting.meeting_name ||
                    "SmartMeet Meeting";


                // ==========================
                // MEETING ID
                // ==========================

                const id =
                    document.createElement("p");

                id.innerText =
                    "Meeting ID: " +
                    meeting.meeting_id;


                // ==========================
                // DURATION
                // ==========================

                const duration =
                    document.createElement("p");

                duration.innerText =
                    "Duration: " +
                    meeting.duration +
                    " minutes";


                // ==========================
                // STATUS
                // ==========================

                const status =
                    document.createElement("p");

                status.innerText =
                    "Status: " +
                    (
                        meeting.status ||
                        "active"
                    );


                // ==========================
                // CREATED DATE
                // ==========================

                const date =
                    document.createElement("p");

                date.innerText =
                    "Created: " +
                    (
                        meeting.created_at ||
                        "N/A"
                    );


                // ==========================
                // DELETE BUTTON
                // ==========================

                const deleteBtn =
                    document.createElement("button");

                deleteBtn.innerText =
                    "Delete";

                deleteBtn.className =
                    "delete-history-btn";


                deleteBtn.type =
                    "button";


                deleteBtn.onclick =
                    function () {

                        deleteMeeting(
                            meeting.meeting_id
                        );

                    };


                // ==========================
                // ADD ELEMENTS
                // ==========================

                card.appendChild(title);

                card.appendChild(id);

                card.appendChild(duration);

                card.appendChild(status);

                card.appendChild(date);

                card.appendChild(deleteBtn);


                historyList.appendChild(card);

            }
        );

    }

    catch (error) {

        console.error(
            "History Error:",
            error
        );


        historyList.innerHTML =
            "<p class='empty-history'>Unable to load meeting history.</p>";

    }

}


// ==========================================
// DELETE MEETING
// ==========================================

async function deleteMeeting(meetingId) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this meeting?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch("https://smartmeet-production.up.railway.app/api/auth/login", +
                encodeURIComponent(meetingId),
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            alert(
                data.message ||
                "Unable to delete meeting."
            );

            return;

        }


        alert(
            "Meeting deleted successfully!"
        );


        // Reload history

        loadHistory();

    }

    catch (error) {

        console.error(
            "Delete Meeting Error:",
            error
        );


        alert(
            "Server connection failed."
        );

    }

}


// ==========================================
// LOAD HISTORY
// ==========================================

loadHistory();

</script>

</body>

</html>
