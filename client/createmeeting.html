<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartMeet - Create Meeting</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>SmartMeet</h1>

    <h2>Create Meeting</h2>

    <input
        type="text"
        id="meetingName"
        placeholder="Meeting Name"
    >

    <input
        type="password"
        id="meetingPassword"
        placeholder="Meeting Password"
    >

    <select id="meetingDuration">
        <option value="60">1 Hour</option>
        <option value="120">2 Hours</option>
        <option value="180">3 Hours</option>
    </select>

    <br><br>

    <button id="createBtn">
        Create Meeting
    </button>

    <div
        id="meetingDetails"
        style="display:none; margin-top:20px;"
    >

        <h3>Meeting Created Successfully</h3>

        <p id="showMeetingId"></p>

        <p id="showMeetingPassword"></p>

        <button id="startMeetingBtn">
            Start Meeting
        </button>

    </div>

</div>


<script>

console.log("CREATE MEETING SCRIPT LOADED");


const API_URL =
    "https://smartmeet-production.up.railway.app";


async function createMeeting() {

    console.log("CREATE BUTTON CLICKED");


    const meetingName =
        document
            .getElementById("meetingName")
            .value
            .trim();


    const meetingPassword =
        document
            .getElementById("meetingPassword")
            .value
            .trim();


    const meetingDuration =
        document
            .getElementById("meetingDuration")
            .value;


    // ======================================
    // VALIDATION
    // ======================================

    if (!meetingName) {

        alert("Please enter Meeting Name!");

        return;

    }


    if (!meetingPassword) {

        alert("Please enter Meeting Password!");

        return;

    }


    // ======================================
    // GENERATE MEETING ID
    // ======================================

    const meetingId =
        Math.floor(
            100000000 +
            Math.random() * 900000000
        );


    console.log(
        "Generated Meeting ID:",
        meetingId
    );


    const createBtn =
        document.getElementById(
            "createBtn"
        );


    createBtn.disabled =
        true;


    createBtn.innerText =
        "Creating Meeting...";


    // ======================================
    // SEND REQUEST
    // ======================================

    console.log(
        "Sending create meeting request..."
    );


    try {

        const response =
            await fetch(
                API_URL +
                "/api/meetings/create",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        meetingId:
                            meetingId,

                        meetingName:
                            meetingName,

                        meetingPassword:
                            meetingPassword,

                        duration:
                            meetingDuration

                    })

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        const data =
            await response.json();


        console.log(
            "SERVER RESPONSE:",
            data
        );


        if (!data.success) {

            alert(
                data.message ||
                "Unable to create meeting."
            );


            createBtn.disabled =
                false;


            createBtn.innerText =
                "Create Meeting";


            return;

        }


        // ======================================
        // SAVE DATA
        // ======================================

        localStorage.setItem(
            "hostMeetingName",
            meetingName
        );


        localStorage.setItem(
            "hostMeetingId",
            String(meetingId)
        );


        localStorage.setItem(
            "hostMeetingPassword",
            meetingPassword
        );


        localStorage.setItem(
            "meetingDuration",
            meetingDuration
        );


        localStorage.setItem(
            "meetingStarted",
            "false"
        );


        localStorage.setItem(
            "joinedUser",
            "Host"
        );


        // ======================================
        // SHOW DETAILS
        // ======================================

        document.getElementById(
            "meetingDetails"
        ).style.display =
            "block";


        document.getElementById(
            "showMeetingId"
        ).innerText =
            "Meeting ID : " +
            meetingId;


        document.getElementById(
            "showMeetingPassword"
        ).innerText =
            "Password : " +
            meetingPassword;


        createBtn.style.display =
            "none";


        alert(
            "Meeting Created Successfully!"
        );

    }

    catch (error) {

        console.error(
            "CREATE MEETING ERROR:",
            error
        );


        alert(
            "Server connection failed: " +
            error.message
        );


        createBtn.disabled =
            false;


        createBtn.innerText =
            "Create Meeting";

    }

}


// ==========================================
// BUTTON CLICK
// ==========================================

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        createMeeting
    );


// ==========================================
// START MEETING
// ==========================================

document
    .getElementById("startMeetingBtn")
    .addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "meetingStarted",
                "true"
            );


            localStorage.setItem(
                "joinedUser",
                "Host"
            );


            window.location.href =
                "meeting.html";

        }
    );


// ==========================================
// LOGIN CHECK
// ==========================================

if (
    localStorage.getItem(
        "isLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
