<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartMeet - Create Meeting</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <h1>Create Meeting</h1>

    <input
        type="text"
        id="meetingName"
        placeholder="Meeting Name"
    >

    <input
        type="password"
        id="meetingPassword"
        placeholder="Meeting Password"
    >

    <select id="meetingDuration">
        <option value="60">1 Hour</option>
        <option value="120">2 Hours</option>
        <option value="180">3 Hours</option>
    </select>

    <br><br>

    <button id="createBtn" type="button">
        Create Meeting
    </button>

    <div
        id="meetingDetails"
        style="display:none; margin-top:20px;"
    >

        <h3>Meeting Created Successfully</h3>

        <p id="showMeetingId"></p>

        <p id="showMeetingPassword"></p>

        <button id="startMeetingBtn" type="button">
            Start Meeting
        </button>

    </div>

</div>


<script>

const API_URL =
    "https://smartmeet-production.up.railway.app";


// ==========================================
// CREATE MEETING
// ==========================================

async function createMeeting() {

    const meetingName =
        document.getElementById("meetingName")
        .value
        .trim();

    const meetingPassword =
        document.getElementById("meetingPassword")
        .value
        .trim();

    const meetingDuration =
        document.getElementById("meetingDuration")
        .value;


    // ==============================
    // VALIDATION
    // ==============================

    if (!meetingName) {

        alert("Please enter Meeting Name!");

        return;
    }


    if (!meetingPassword) {

        alert("Please enter Meeting Password!");

        return;
    }


    // ==============================
    // GENERATE MEETING ID
    // ==============================

    const meetingId =
        Math.floor(
            100000000 +
            Math.random() * 900000000
        );


    const createBtn =
        document.getElementById("createBtn");


    createBtn.disabled = true;

    createBtn.innerText =
        "Creating Meeting...";


    try {

        // ==============================
        // CREATE MEETING API
        // ==============================

        const response =
            await fetch(
                API_URL +
                "/api/meetings/create",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        meetingId:
                            meetingId,

                        meetingName:
                            meetingName,

                        meetingPassword:
                            meetingPassword,

                        duration:
                            meetingDuration

                    })
                }
            );


        // ==============================
        // CHECK HTTP RESPONSE
        // ==============================

        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        // ==============================
        // API ERROR
        // ==============================

        if (!data.success) {

            alert(
                data.message ||
                "Unable to create meeting."
            );

            createBtn.disabled =
                false;

            createBtn.innerText =
                "Create Meeting";

            return;
        }


        // ==============================
        // SAVE MEETING DATA
        // ==============================

        localStorage.setItem(
            "hostMeetingName",
            meetingName
        );

        localStorage.setItem(
            "hostMeetingId",
            String(meetingId)
        );

        localStorage.setItem(
            "hostMeetingPassword",
            meetingPassword
        );

        localStorage.setItem(
            "meetingDuration",
            meetingDuration
        );

        localStorage.setItem(
            "meetingStarted",
            "false"
        );

        localStorage.setItem(
            "joinedUser",
            "Host"
        );


        // ==============================
        // SAVE HISTORY
        // ==============================

        let history =
            JSON.parse(
                localStorage.getItem(
                    "meetingHistory"
                )
            ) || [];


        history.push({

            name:
                meetingName,

            id:
                meetingId,

            password:
                meetingPassword,

            duration:
                meetingDuration,

            date:
                new Date()
                .toLocaleString()

        });


        localStorage.setItem(
            "meetingHistory",
            JSON.stringify(history)
        );


        // ==============================
        // SHOW DETAILS
        // ==============================

        document.getElementById(
            "meetingDetails"
        ).style.display =
            "block";


        document.getElementById(
            "showMeetingId"
        ).innerText =
            "Meeting ID : " +
            meetingId;


        document.getElementById(
            "showMeetingPassword"
        ).innerText =
            "Password : " +
            meetingPassword;


        createBtn.style.display =
            "none";


        alert(
            "Meeting Created Successfully!"
        );

    }

    catch (error) {

        console.error(
            "Create Meeting Error:",
            error
        );


        alert(
            "Unable to connect to SmartMeet server."
        );


        createBtn.disabled =
            false;

        createBtn.innerText =
            "Create Meeting";

    }

}


// ==========================================
// CREATE BUTTON
// ==========================================

document
    .getElementById("createBtn")
    .addEventListener(
        "click",
        createMeeting
    );


// ==========================================
// START MEETING
// ==========================================

document
    .getElementById("startMeetingBtn")
    .addEventListener(
        "click",
        function () {

            localStorage.setItem(
                "meetingStarted",
                "true"
            );

            localStorage.setItem(
                "joinedUser",
                "Host"
            );

            window.location.href =
                "meeting.html";

        }
    );


// ==========================================
// LOGIN CHECK
// ==========================================

if (
    localStorage.getItem(
        "isLoggedIn"
    ) !== "true"
) {

    window.location.href =
        "login.html";

}

</script>

</body>
</html>
